name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/build-rmskin.ps1
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rmskin
          generate_release_notes: true
