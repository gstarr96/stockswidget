; AI Stock News - settings
;
; On first run this file is copied to %APPDATA%\AIStockNewsWidget\config.ini.
; Edit that copy (right-click the widget > "Edit settings"), not this template.
; config.ini holds your API key: never share or commit it.
;
; A blank key falls back to the OPENAI_API_KEY or ANTHROPIC_API_KEY
; environment variable.

[stocks]
; Comma-separated tickers to follow, e.g. AAPL, NVDA, TSLA. Leave blank to show
; the day's biggest gainers and losers instead.
watchlist =
; Number of stocks in the carousel (1-10).
count = 5

[ai]
; Which AI researches and explains each move: openai or anthropic.
; Both use the provider's built-in web search tool, billed to your account.
provider = openai

; https://platform.openai.com/api-keys
openai_api_key =
openai_model = gpt-5-mini

; https://console.anthropic.com/settings/keys
anthropic_api_key =
anthropic_model = claude-haiku-4-5

; While the market is open, re-research a stock at most this often (5-1440
; minutes). Outside market hours each stock is researched once per session.
; Prices and charts refresh on every widget update regardless.
summary_refresh_minutes = 120

[charts]
; Spacing between intraday chart points: 1m, 2m, 5m, 15m or 30m
interval = 5m
